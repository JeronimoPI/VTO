name: Desktop development builds
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: macOS-Intel
          - os: macos-15
            target: macOS-Apple-Silicon
          - os: windows-2022
            target: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_desktop.py
      - run: python scripts/verify_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: VTO-${{ matrix.target }}-development
          path: dist/*.zip
          if-no-files-found: error
